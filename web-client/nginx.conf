server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        proxy_pass http://mychat-authentication:8081;
    }

    location /api/v1/self/ {
        proxy_pass http://usermicroservice:8082;
    }

    location /api/v1/recommendation/ {
        proxy_pass http://recommendation:8083;
    }

    location /api/v1/swipe/ {
        proxy_pass http://swipe-microservice:8084;
    }

    location /api/v1/chat/ {
        proxy_pass http://notification-microservice:8085;
    }

    location /api/v1/notification/ {
        proxy_pass http://notification-microservice:8085;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }
}
