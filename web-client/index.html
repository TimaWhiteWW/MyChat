<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyChat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="authView" class="auth-shell">
    <section class="auth-panel">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <h1>MyChat</h1>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="tab active" data-auth-tab="login" type="button">Вход</button>
        <button class="tab" data-auth-tab="register" type="button">Регистрация</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
        <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <label>Имя<input id="registerName" required></label>
        <label>Тег<input id="registerTag" required minlength="3" maxlength="20" placeholder="timawhte1"></label>
        <label>Email<input id="registerEmail" type="email" autocomplete="email" required></label>
        <label>Пароль<input id="registerPassword" type="password" autocomplete="new-password" required minlength="10"></label>
        <label>Повтор пароля<input id="registerPasswordConfirmation" type="password" autocomplete="new-password" required minlength="10"></label>
        <button type="submit">Создать аккаунт</button>
      </form>

      <form id="verifyForm" class="auth-form hidden">
        <label>Код подтверждения<input id="verifyCode" required placeholder="000000"></label>
        <button type="submit">Подтвердить email</button>
      </form>
    </section>
  </main>

  <main id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="account">
        <div id="sidebarAvatar" class="avatar">M</div>
        <div>
          <h2>MyChat</h2>
          <p id="currentUserLabel"></p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="profile" type="button">Профиль</button>
        <button class="nav-item" data-view="recommendations" type="button">Рекомендации</button>
        <button class="nav-item" data-view="chat" type="button">Чат</button>
      </nav>

      <button id="logoutBtn" class="ghost" type="button">Выйти</button>
    </aside>

    <section class="workspace">
      <section id="profileView" class="screen">
        <header class="screen-head">
          <div>
            <h1>Профиль</h1>
          </div>
          <button id="saveProfileBtn" type="button">Сохранить</button>
        </header>

        <div class="profile-page">
          <section class="profile-card">
            <div id="profileAvatarPreview" class="profile-avatar">M</div>
            <label class="file-button">
              Выбрать фото
              <input id="profilePictures" type="file" accept="image/*">
            </label>
            <strong id="profilePreviewName">Ваш профиль</strong>
            <span id="profilePreviewMeta" class="meta"></span>
          </section>

          <section class="profile-form">
            <div class="form-section">
              <h3>Основное</h3>
              <div class="form-grid compact">
                <label>Тег<input id="profileTag" required></label>
                <label>Email<input id="profileEmail" type="email" required></label>
                <label>Имя<input id="profileName" required></label>
                <label>Фамилия<input id="profileSurname" required></label>
                <label>Возраст<input id="profileAge" type="number" min="18" max="150" value="21"></label>
                <label>Пол<select id="profileGender"><option>MALE</option><option>FEMALE</option></select></label>
                <label>Город<input id="profileCity" required value="Moscow"></label>
                <label>Страна<input id="profileCountry" required value="Russia"></label>
                <label>Телефон<input id="profilePhone" placeholder="+79990000000"></label>
              </div>
            </div>

            <div class="form-section">
              <h3>О себе</h3>
              <div class="form-grid compact">
                <label>Вес, кг<input id="profileWeight" type="number" min="30" max="250" value="70"></label>
                <label>Рост, м<input id="profileHeight" type="number" min="1" max="3" step="0.01" value="1.75"></label>
                <label>Доход<input id="profileEarnings" type="number" min="0" value="0"></label>
                <label>Хобби<select id="profileHobby" multiple></select></label>
                <label>Профессии<select id="profileProfession" multiple></select></label>
                <label class="wide">Описание<textarea id="profileAboutMe" maxlength="500"></textarea></label>
              </div>
            </div>

            <div class="form-section">
              <h3>Кого ищем</h3>
              <div class="form-grid compact">
                <label>Хобби<select id="preferencesHobby" multiple></select></label>
                <label>Профессии<select id="preferencesProfessions" multiple></select></label>
                <label>Возраст от<input id="minAge" type="number" min="18" max="150" value="18"></label>
                <label>Возраст до<input id="maxAge" type="number" min="18" max="150" value="60"></label>
                <label>Рост от<input id="minHeight" type="number" min="0" max="3" step="0.01" value="1.4"></label>
                <label>Рост до<input id="maxHeight" type="number" min="0" max="3" step="0.01" value="2.2"></label>
                <label>Мин. доход<input id="minEarnings" type="number" min="0" value="0"></label>
                <label>Мин. BMI<input id="minBMI" type="number" min="0" max="100" step="0.1" value="0"></label>
                <label>Макс. BMI<input id="maxBMI" type="number" min="0" max="100" step="0.1" value="100"></label>
                <label>Дистанция, км<input id="distance" type="number" min="0" max="40000" value="100"></label>
              </div>
            </div>

            <div class="form-section">
              <h3>Характер</h3>
              <div class="form-grid compact sliders">
                <label>Экстраверсия<input id="personalityExtraversion" type="range" min="0" max="10" step="0.5" value="5"></label>
                <label>Открытость<input id="personalityOpenness" type="range" min="0" max="10" step="0.5" value="5"></label>
                <label>Добросовестность<input id="personalityConscientiousness" type="range" min="0" max="10" step="0.5" value="5"></label>
                <label>Семья<input id="lifeValueFamily" type="range" min="0" max="10" step="0.5" value="5"></label>
                <label>Карьера<input id="lifeValueCareer" type="range" min="0" max="10" step="0.5" value="5"></label>
                <label>Активность<input id="activityLevel" type="range" min="0" max="10" step="0.5" value="5"></label>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section id="recommendationsView" class="screen hidden">
        <header class="screen-head">
          <div>
            <h1>Рекомендации</h1>
          </div>
          <button id="loadRecommendationsBtn" type="button">Обновить</button>
        </header>
        <div id="recommendationsList" class="cards"></div>
      </section>

      <section id="chatView" class="screen hidden">
        <header class="screen-head">
          <div>
            <h1>Чат</h1>
            <p id="chatTitle" class="meta"></p>
          </div>
        </header>
        <div class="chat-layout">
          <aside id="chatList" class="dialog-list"></aside>
          <div class="chat-panel">
            <div id="messages" class="messages"></div>
            <form id="messageForm" class="message-form">
              <input id="messageInput" placeholder="Сообщение..." autocomplete="off">
              <button type="submit">Отправить</button>
            </form>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
